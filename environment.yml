name: studymate
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - scikit-learn        
  - pip:
      - pymupdf
      - flask
      - flask-cors
      - openai            # client for DeepSeek / Ollama / Groq (all OpenAI-compatible)
      - pillow
      - opencv-python
      - pytesseract
      - python-dotenv
      - jieba
      - FlagEmbedding
      - faiss-cpu
      - modelscope