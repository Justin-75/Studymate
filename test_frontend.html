<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学习伴侣 · 完整前端演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main {
            padding: 40px;
        }

        /* 步骤指示器 */
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }

        .steps::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 4px;
            background: #e0e0e0;
            z-index: 1;
        }

        .step-item {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .step-number {
            width: 40px;
            height: 40px;
            background: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            color: white;
            font-weight: bold;
            transition: all 0.3s;
        }

        .step-item.active .step-number {
            background: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .step-item.completed .step-number {
            background: #4caf50;
        }

        .step-label {
            color: #666;
            font-size: 0.9em;
        }

        .step-item.active .step-label {
            color: #667eea;
            font-weight: bold;
        }

        /* 内容区域 */
        .step-content {
            display: none;
            animation: fadeIn 0.5s;
        }

        .step-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 上传区域 */
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 20px;
            padding: 60px 30px;
            text-align: center;
            background: #f8faff;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }

        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        /* 按钮 */
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
            border: 2px solid transparent;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        /* 模式卡片 */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .mode-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.1);
        }

        .mode-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .mode-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .mode-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .mode-desc {
            color: #666;
            font-size: 0.9em;
        }

        /* 查询输入框 */
        .query-section {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .query-label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }

        .query-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 状态消息 */
        .status-message {
            padding: 15px 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 结果卡片 */
        .result-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
        }

        .quiz-question {
            background: #f9f9f9;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
        }

        .quiz-options {
            margin: 15px 0;
        }

        .quiz-option {
            display: block;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            background: #f0f4ff;
            border-color: #667eea;
        }

        .quiz-option input {
            margin-right: 10px;
        }

        .flashcard {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .flashcard:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .flashcard-front,
        .flashcard-back {
            min-height: 100px;
        }

        .flashcard-back {
            display: none;
            border-top: 1px dashed #ccc;
            margin-top: 15px;
            padding-top: 15px;
        }

        .flashcard.show-back .flashcard-front {
            display: none;
        }

        .flashcard.show-back .flashcard-back {
            display: block;
        }

        /* 导航按钮 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }

        /* 文档ID显示 */
        .doc-id-box {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .doc-id-code {
            font-family: monospace;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #667eea;
            color: #667eea;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📚 AI 学习伴侣</h1>
            <p>上传 PDF，智能生成摘要、抽认卡与测验</p>
        </div>

        <div class="main">
            <!-- 步骤指示器 -->
            <div class="steps">
                <div class="step-item active" id="step1-indicator">
                    <div class="step-number">1</div>
                    <div class="step-label">上传 PDF</div>
                </div>
                <div class="step-item" id="step2-indicator">
                    <div class="step-number">2</div>
                    <div class="step-label">选择模式</div>
                </div>
                <div class="step-item" id="step3-indicator">
                    <div class="step-number">3</div>
                    <div class="step-label">学习材料</div>
                </div>
                <div class="step-item" id="step4-indicator">
                    <div class="step-number">4</div>
                    <div class="step-label">测验评分</div>
                </div>
            </div>

            <!-- 步骤1: 上传PDF -->
            <div id="step1" class="step-content active">
                <h2 style="margin-bottom: 20px;">📤 上传 PDF 文档</h2>

                <!-- 上传区域 -->
                <div id="uploadArea" class="upload-area">
                    <div class="upload-icon">📄</div>
                    <div class="upload-hint">支持 .pdf 格式，文件大小不超过 50MB</div>
                    <input type="file" id="fileInput" accept=".pdf" style="display: none;">
                    <button class="btn" id="selectFileBtn" style="margin-top: 20px;">选择文件</button>
                </div>

                <!-- 文件信息及上传按钮 -->
                <div id="fileInfo" class="hidden"
                    style="margin: 20px 0; padding: 20px; background: #f9f9f9; border-radius: 10px;">
                    <p style="margin-bottom: 15px;">📌 已选择文件：<strong id="fileName"></strong></p>
                    <button class="btn" id="uploadBtn">开始上传</button>
                    <button class="btn btn-outline" id="cancelBtn">重新选择</button>
                </div>

                <!-- 上传进度 -->
                <div id="uploadProgress" class="hidden" style="margin: 20px 0;">
                    <p><span class="loading"></span>正在处理 PDF，请稍候...</p>
                    <div style="background: #e0e0e0; border-radius: 10px; height: 10px; margin-top: 15px;">
                        <div id="progressBar"
                            style="width: 0%; height: 10px; background: #667eea; border-radius: 10px; transition: width 0.3s;">
                        </div>
                    </div>
                </div>

                <!-- 上传结果 -->
                <div id="uploadResult" class="hidden">
                    <div class="status-message status-success">
                        ✅ PDF 上传并处理成功！
                    </div>
                    <div class="doc-id-box">
                        <span>文档 ID：</span>
                        <span class="doc-id-code" id="docIdDisplay"></span>
                        <button class="btn btn-outline" id="copyDocIdBtn"
                            style="margin: 0; padding: 8px 20px;">复制</button>
                    </div>
                    <button class="btn" id="gotoStep2Btn" style="width: 100%;">下一步：选择学习模式</button>
                </div>

                <!-- 错误信息 -->
                <div id="uploadError" class="status-message status-error hidden"></div>
            </div>

            <!-- 步骤2: 选择学习模式 -->
            <div id="step2" class="step-content">
                <h2 style="margin-bottom: 20px;">🎯 选择学习模式</h2>

                <!-- 模式卡片 -->
                <div class="mode-grid">
                    <div class="mode-card" data-mode="summary">
                        <div class="mode-icon">📝</div>
                        <div class="mode-title">摘要</div>
                        <div class="mode-desc">生成核心观点、关键点和摘要</div>
                    </div>
                    <div class="mode-card" data-mode="flashcards">
                        <div class="mode-icon">🎴</div>
                        <div class="mode-title">抽认卡</div>
                        <div class="mode-desc">创建问答卡片，帮助记忆</div>
                    </div>
                    <div class="mode-card" data-mode="quiz">
                        <div class="mode-icon">❓</div>
                        <div class="mode-title">测验</div>
                        <div class="mode-desc">生成试题并评测</div>
                    </div>
                </div>

                <!-- 查询输入 -->
                <div id="querySection" class="query-section hidden">
                    <label for="queryInput" class="query-label">🔍 查询内容</label>
                    <input type="text" id="queryInput" class="query-input" value="introduction">
                </div>

                <!-- 生成按钮 -->
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" id="generateBtn" disabled>请先选择模式</button>
                </div>

                <!-- 状态显示 -->
                <div id="generateStatus" class="status-message hidden"></div>

                <!-- 导航按钮 -->
                <div class="nav-buttons">
                    <button class="btn btn-outline" id="backToStep1Btn">← 上一步</button>
                </div>
            </div>

            <!-- 步骤3: 学习材料展示 -->
            <div id="step3" class="step-content">
                <h2 style="margin-bottom: 20px;">📖 学习材料</h2>

                <!-- 内容容器 -->
                <div id="resultContainer"></div>

                <!-- 测验提交区域（仅当模式为测验时显示） -->
                <div id="quizSubmitSection" class="hidden" style="margin-top: 30px;">
                    <button class="btn" id="submitQuizBtn" style="width: 100%;">提交答案</button>
                </div>

                <!-- 导航按钮 -->
                <div class="nav-buttons">
                    <button class="btn btn-outline" id="backToStep2Btn">← 上一步</button>
                    <button class="btn" id="gotoStep4Btn" style="display: none;">下一步：查看评分</button>
                </div>
            </div>

            <!-- 步骤4: 测验评分结果 -->
            <div id="step4" class="step-content">
                <h2 style="margin-bottom: 20px;">📊 测验评分</h2>
                <div id="gradeResultContainer"></div>
                <div class="nav-buttons">
                    <button class="btn btn-outline" id="backToStep3Btn">← 返回</button>
                    <button class="btn" id="restartBtn">🔄 重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- 全局状态 ----------
        const API_BASE = 'http://localhost:5000/api';

        // 存储状态
        let appState = {
            docId: null,                // 当前文档ID
            selectedMode: null,         // 当前选择模式 summary / flashcards / quiz
            query: '',                 // 查询词
            currentQuizData: null,     // 完整的测验数据（用于评分）
            currentQuizId: null,       // 测验ID（备用）
            userAnswers: {},          // 用户答案
            generateResult: null      // 生成的结果
        };

        // DOM 元素引用
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const step4 = document.getElementById('step4');
        const stepIndicators = {
            1: document.getElementById('step1-indicator'),
            2: document.getElementById('step2-indicator'),
            3: document.getElementById('step3-indicator'),
            4: document.getElementById('step4-indicator')
        };

        // ---------- 工具函数 ----------
        function showStep(stepNumber) {
            // 隐藏所有步骤
            step1.classList.remove('active');
            step2.classList.remove('active');
            step3.classList.remove('active');
            step4.classList.remove('active');

            // 显示对应步骤
            document.getElementById(`step${stepNumber}`).classList.add('active');

            // 更新步骤指示器
            for (let i = 1; i <= 4; i++) {
                stepIndicators[i].classList.remove('active');
                if (i === stepNumber) {
                    stepIndicators[i].classList.add('active');
                } else if (i < stepNumber) {
                    stepIndicators[i].classList.add('completed');
                } else {
                    stepIndicators[i].classList.remove('completed');
                }
            }
        }

        function showStatus(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'status-message'; // 重置
            if (type === 'success') {
                el.classList.add('status-success');
            } else if (type === 'error') {
                el.classList.add('status-error');
            } else {
                el.classList.add('status-info');
            }
            el.style.display = 'block';
        }

        function hideStatus(elementId) {
            const el = document.getElementById(elementId);
            el.style.display = 'none';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('复制成功！');
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            });
        }

        // ---------- 上传PDF ----------
        const fileInput = document.getElementById('fileInput');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const uploadArea = document.getElementById('uploadArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressBar = document.getElementById('progressBar');
        const uploadResult = document.getElementById('uploadResult');
        const docIdDisplay = document.getElementById('docIdDisplay');
        const copyDocIdBtn = document.getElementById('copyDocIdBtn');
        const uploadError = document.getElementById('uploadError');
        const gotoStep2Btn = document.getElementById('gotoStep2Btn');

        // 选择文件
        selectFileBtn.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
                fileInfo.classList.remove('hidden');
                uploadArea.style.display = 'none';
                uploadError.style.display = 'none';
            }
        });

        // 取消选择
        cancelBtn.addEventListener('click', function () {
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            uploadArea.style.display = 'block';
        });

        // 上传文件
        uploadBtn.addEventListener('click', async function () {
            const file = fileInput.files[0];
            if (!file) return;

            // 显示进度条
            fileInfo.classList.add('hidden');
            uploadProgress.classList.remove('hidden');
            progressBar.style.width = '0%';
            hideStatus('uploadError');

            const formData = new FormData();
            formData.append('file', file);

            try {
                // 模拟进度动画
                let progress = 0;
                const interval = setInterval(() => {
                    progress = Math.min(progress + 5, 90);
                    progressBar.style.width = progress + '%';
                }, 200);

                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });

                clearInterval(interval);
                progressBar.style.width = '100%';

                const data = await response.json();

                if (data.success) {
                    appState.docId = data.doc_id;
                    docIdDisplay.textContent = data.doc_id;

                    setTimeout(() => {
                        uploadProgress.classList.add('hidden');
                        uploadResult.classList.remove('hidden');
                    }, 500);
                } else {
                    throw new Error(data.error || '上传失败');
                }
            } catch (error) {
                uploadProgress.classList.add('hidden');
                showStatus('uploadError', '❌ ' + error.message, 'error');
                fileInfo.classList.remove('hidden'); // 允许重试
            }
        });

        // 复制文档ID
        copyDocIdBtn.addEventListener('click', function () {
            copyToClipboard(appState.docId);
        });

        // 进入步骤2
        gotoStep2Btn.addEventListener('click', function () {
            showStep(2);
        });

        // ---------- 步骤2：选择模式 ----------
        const modeCards = document.querySelectorAll('.mode-card');
        const querySection = document.getElementById('querySection');
        const queryInput = document.getElementById('queryInput');
        const generateBtn = document.getElementById('generateBtn');
        const backToStep1Btn = document.getElementById('backToStep1Btn');
        const generateStatus = document.getElementById('generateStatus');

        // 模式选择
        modeCards.forEach(card => {
            card.addEventListener('click', function () {
                // 移除其他选中状态
                modeCards.forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');

                const mode = this.dataset.mode;
                appState.selectedMode = mode;

                // 显示查询输入框（可选）
                querySection.classList.remove('hidden');

                // 启用生成按钮
                generateBtn.disabled = false;
                generateBtn.textContent = `生成 ${this.querySelector('.mode-title').textContent}`;
            });
        });

        // 返回步骤1
        backToStep1Btn.addEventListener('click', () => showStep(1));

        // 生成内容
        generateBtn.addEventListener('click', async function () {
            if (!appState.docId) {
                showStatus('generateStatus', '请先上传PDF文档', 'error');
                return;
            }
            if (!appState.selectedMode) {
                showStatus('generateStatus', '请先选择学习模式', 'error');
                return;
            }

            appState.query = queryInput.value.trim();

            // 显示加载状态
            generateBtn.disabled = true;
            showStatus('generateStatus', '正在生成内容...', 'info');

            try {
                const response = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        doc_id: appState.docId,
                        mode: appState.selectedMode,
                        query: appState.query,
                        top_k: 8
                    })
                });

                const data = await response.json();

                if (data.success) {
                    hideStatus('generateStatus');
                    appState.generateResult = data.data;

                    // 保存测验数据（如果是测验模式）
                    if (appState.selectedMode === 'quiz') {
                        appState.currentQuizData = data.data;
                        appState.currentQuizId = data.quiz_id || null;
                    }

                    // 显示结果并进入步骤3
                    displayResult(data.data);
                    showStep(3);
                } else {
                    throw new Error(data.error || '生成失败');
                }
            } catch (error) {
                showStatus('generateStatus', '❌ ' + error.message, 'error');
            } finally {
                generateBtn.disabled = false;
            }
        });

        // ---------- 步骤3：显示结果 ----------
        const resultContainer = document.getElementById('resultContainer');
        const quizSubmitSection = document.getElementById('quizSubmitSection');
        const submitQuizBtn = document.getElementById('submitQuizBtn');
        const backToStep2Btn = document.getElementById('backToStep2Btn');
        const gotoStep4Btn = document.getElementById('gotoStep4Btn');

        // 显示结果（根据模式）
        function displayResult(data) {
            // ========== 1. 强制输出到控制台，让你看到真实数据 ==========
            console.log('===== displayResult 接收到的数据 =====');
            console.log(JSON.stringify(data, null, 2));
            console.log('当前模式:', appState.selectedMode);
            console.log('========================================');

            resultContainer.innerHTML = '';
            appState.userAnswers = {};

            // ========== 2. 如果后端返回了消息（如无内容） ==========
            if (data && typeof data === 'object' && data.message) {
                resultContainer.innerHTML = `
                    <div class="result-card" style="text-align: center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 20px;">📭</div>
                        <h3 style="color: #666; margin-bottom: 15px;">暂无相关内容</h3>
                        <p style="color: #999; margin-bottom: 20px;">${data.message}</p>
                        <p style="color: #999;">您可以尝试：</p>
                        <ul style="list-style: none; padding: 0; margin-top: 15px; color: #667eea;">
                            <li style="margin: 8px 0;">• 使用其他查询词（如 "introduction"）</li>
                            <li style="margin: 8px 0;">• 上传内容更丰富的PDF</li>
                            <li style="margin: 8px 0;">• 切换不同的学习模式</li>
                        </ul>
                    </div>
                `;
                return;
            }

            // ========== 3. 摘要模式 ==========
            if (appState.selectedMode === 'summary') {
                let html = '<div class="result-card">';
                html += '<h3 style="margin-bottom: 20px; color: #667eea;">📋 摘要</h3>';

                // 1. 核心观点（main_idea）
                if (data.main_idea) {
                    html += `<div style="background: #f0f4ff; padding: 20px; border-radius: 10px; margin-bottom: 25px;">`;
                    html += `<p style="font-size: 1.1em; line-height: 1.6; color: #333;">${data.main_idea}</p>`;
                    html += `</div>`;
                }

                // 2. 完整摘要（summary）
                if (data.summary) {
                    html += `<h4 style="margin: 0 0 10px 0; color: #444;">📄 摘要</h4>`;
                    html += `<p style="margin-bottom: 25px;">${data.summary}</p>`;
                }

                // 3. 关键点（key_points：对象数组，包含 text 和 page）
                if (data.key_points && Array.isArray(data.key_points) && data.key_points.length > 0) {
                    html += `<h4 style="margin: 0 0 15px 0; color: #444;">🔑 关键点</h4>`;
                    html += '<ul style="list-style: none; padding: 0; margin: 0 0 20px 0;">';
                    data.key_points.forEach((kp, idx) => {
                        const text = kp.text || '';
                        const page = kp.page ? ` <span style="color: #999; font-size: 0.9em;">(第 ${kp.page} 页)</span>` : '';
                        html += `<li style="padding: 10px 15px; margin-bottom: 8px; background: #f9f9f9; border-left: 4px solid #667eea; border-radius: 0 8px 8px 0;">
                                <span style="font-weight: bold; color: #667eea; margin-right: 10px;">${idx + 1}.</span>
                                ${text}${page}
                            </li>`;
                    });
                    html += '</ul>';
                }

                // 4. 如果没有任何内容，显示原始 JSON（调试用）
                if (!data.main_idea && !data.summary && (!data.key_points || data.key_points.length === 0)) {
                    html += `<pre style="background: #f5f5f5; padding: 15px; overflow: auto;">${JSON.stringify(data, null, 2)}</pre>`;
                }

                html += '</div>';
                resultContainer.innerHTML = html;
                return;
            }
            // ========== 4. 抽认卡模式 ==========
            if (appState.selectedMode === 'flashcards') {
                // 尝试多种可能的字段名
                let cards = data.cards || data.flashcards || data.card_list || [];
                if (cards.length === 0 && data.data && Array.isArray(data.data)) {
                    cards = data.data; // 万一包在 data.data 里
                }

                if (cards.length === 0) {
                    // 还是没找到，显示原始JSON
                    resultContainer.innerHTML = `<pre style="background:#f5f5f5; padding:20px; overflow:auto;">${JSON.stringify(data, null, 2)}</pre>`;
                    return;
                }

                let html = '<div style="display: grid; gap: 20px;">';
                cards.forEach((card, index) => {
                    const front = card.front || card.question || card.term || '问题';
                    const back = card.back || card.answer || card.definition || '答案';
                    const why = card.why || card.reason || card.importance || '';
                    html += `
                        <div class="flashcard" onclick="this.classList.toggle('show-back')">
                            <div class="flashcard-front">
                                <strong style="color: #667eea;">🎴 卡片 ${index + 1}</strong>
                                <p style="margin-top: 10px; font-size: 1.1em;">${front}</p>
                                <p style="margin-top: 15px; color: #999; font-size: 0.85em;">点击查看答案 👆</p>
                            </div>
                            <div class="flashcard-back">
                                <strong style="color: #764ba2;">📖 答案</strong>
                                <p style="margin-top: 10px;">${back}</p>
                                ${why ? `
                                <div style="margin-top: 15px; padding: 12px; background: #fff3e0; border-left: 4px solid #ff9800; border-radius: 0 8px 8px 0;">
                                    <strong style="color: #e65100;">💡 为什么重要</strong>
                                    <p style="margin-top: 5px; color: #555;">${why}</p>
                                </div>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                resultContainer.innerHTML = html;
                return;
            }

            // ========== 5. 测验模式 ==========
            if (appState.selectedMode === 'quiz') {
                let questions = data.questions || data.quiz || [];

                // 如果题目为空，显示友好提示
                if (questions.length === 0) {
                    resultContainer.innerHTML = `
                        <div class="result-card" style="text-align: center; padding: 40px;">
                            <div style="font-size: 48px; margin-bottom: 20px;">🤔</div>
                            <h3 style="color: #666; margin-bottom: 15px;">未能生成测验题目</h3>
                            <p style="color: #999; margin-bottom: 20px;">当前内容可能不适合出题，或筛选条件过于严格。</p>
                            <p style="color: #999;">您可以尝试：</p>
                            <ul style="list-style: none; padding: 0; margin-top: 15px; color: #667eea;">
                                <li style="margin: 8px 0;">• 输入更具体的查询词</li>
                                <li style="margin: 8px 0;">• 切换为摘要或抽认卡模式</li>
                                <li style="margin: 8px 0;">• 上传其他PDF文件</li>
                            </ul>

                        </div>
                    `;
                    return;
                }

                if (questions.length === 0 && data.data && Array.isArray(data.data)) {
                    questions = data.data;
                }

                if (questions.length === 0) {
                    resultContainer.innerHTML = `<pre style="background:#f5f5f5; padding:20px; overflow:auto;">${JSON.stringify(data, null, 2)}</pre>`;
                    return;
                }

                let html = '<div class="result-card">';
                html += '<h3 style="margin-bottom: 20px; color: #667eea;">❓ 测验</h3>';

                questions.forEach((q, idx) => {
                    const qid = q.id || `q${idx}`;
                    const questionText = q.question || q.text || '问题';
                    const qtype = q.type || 'mcq';
                    const difficulty = q.difficulty || '';

                    // 难度颜色映射
                    const diffColors = { '简单': '#4caf50', '中': '#ff9800', '难': '#f44336' };
                    const diffColor = diffColors[difficulty] || '#999';

                    // 题型标签
                    const typeLabels = { 'mcq': '选择题', 'fill_blank': '填空题', 'short': '简答题' };
                    const typeLabel = typeLabels[qtype] || '题目';

                    html += `<div class="quiz-question">`;
                    html += `<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">`;
                    html += `<h4 style="margin: 0;">${idx + 1}. ${questionText}</h4>`;
                    html += `</div>`;
                    html += `<div style="display: flex; gap: 8px; margin-bottom: 12px;">`;
                    html += `<span style="background: ${diffColor}; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8em;">${difficulty}</span>`;
                    html += `<span style="background: #667eea; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8em;">${typeLabel}</span>`;
                    html += `</div>`;

                    if (qtype === 'mcq' && q.options && Array.isArray(q.options)) {
                        html += '<div class="quiz-options">';
                        q.options.forEach((opt, optIdx) => {
                            const optionId = `${qid}_${optIdx}`;
                            html += `
                                <label class="quiz-option">
                                    <input type="radio" name="${qid}" value="${String.fromCharCode(65 + optIdx)}" onchange="updateAnswer('${qid}', this.value)">
                                    ${opt}
                                </label>
                            `;
                        });
                        html += '</div>';
                    } else if (qtype === 'fill_blank') {
                        html += `
                            <input type="text" id="${qid}" placeholder="请填写答案..." 
                                    style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;"
                                    onchange="updateAnswer('${qid}', this.value)">
                        `;
                    } else if (qtype === 'short') {
                        html += `
                            <textarea id="${qid}" rows="3" placeholder="请输入简答..." 
                                    style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;"
                                    onchange="updateAnswer('${qid}', this.value)"></textarea>
                        `;
                    } else if (q.options && Array.isArray(q.options)) {
                        html += '<div class="quiz-options">';
                        q.options.forEach((opt, optIdx) => {
                            html += `
                                <label class="quiz-option">
                                    <input type="radio" name="${qid}" value="${String.fromCharCode(65 + optIdx)}" onchange="updateAnswer('${qid}', this.value)">
                                    ${opt}
                                </label>
                            `;
                        });
                        html += '</div>';
                    } else {
                        html += `
                            <textarea id="${qid}" rows="3" placeholder="请输入答案..." 
                                    style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;"
                                    onchange="updateAnswer('${qid}', this.value)"></textarea>
                        `;
                    }

                    html += '</div>';
                });

                html += '</div>';
                resultContainer.innerHTML = html;

                // 保存测验数据以供评分
                appState.currentQuizData = data;
                appState.currentQuizId = data.quiz_id || null;

                // 显示提交按钮
                document.getElementById('quizSubmitSection').classList.remove('hidden');
                return;
            }

            // ========== 6. 未知模式或数据结构异常：保底显示原始JSON ==========
            resultContainer.innerHTML = `
                <div class="result-card">
                    <h3 style="color: #f44336;">⚠️ 无法识别的数据格式</h3>
                    <p>请在控制台查看完整输出，或复制以下JSON：</p>
                    <pre style="background:#f5f5f5; padding:15px; overflow:auto; max-height:400px;">${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }
        // 全局函数：更新用户答案
        window.updateAnswer = function (questionId, value) {
            appState.userAnswers[questionId] = value;
            console.log(`更新答案: ${questionId} = ${value}`);
            console.log('当前所有答案:', appState.userAnswers);
        };

        // 提交测验
        submitQuizBtn.addEventListener('click', async function () {
            if (!appState.currentQuizData) {
                alert('测验数据丢失，请重新生成');
                return;
            }

            submitQuizBtn.disabled = true;
            submitQuizBtn.textContent = '提交中...';

            try {
                const response = await fetch(`${API_BASE}/grade`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        quiz: appState.currentQuizData,   // 完整的测验对象
                        answers: appState.userAnswers
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // 显示评分结果
                    displayGradeResult(data.result);
                    showStep(4);
                } else {
                    throw new Error(data.error || '评分失败');
                }
            } catch (error) {
                alert('提交失败: ' + error.message);
            } finally {
                submitQuizBtn.disabled = false;
                submitQuizBtn.textContent = '提交答案';
            }
        });

        function safeMapUserAnswer(userAnswer) {
            if (userAnswer === null || userAnswer === undefined) return '(未回答)';

            // 如果已经是字母 A-D，直接返回
            if (typeof userAnswer === 'string' && /^[ABCD]$/i.test(userAnswer)) {
                return userAnswer.toUpperCase();
            }

            // 如果是数字 0-3
            if (typeof userAnswer === 'number' && userAnswer >= 0 && userAnswer <= 3) {
                return ['A', 'B', 'C', 'D'][userAnswer];
            }

            // 如果是数字字符串 "0"-"3"
            if (typeof userAnswer === 'string' && /^[0-3]$/.test(userAnswer)) {
                return ['A', 'B', 'C', 'D'][parseInt(userAnswer, 10)];
            }

            // 其他情况（如 "A." 等）尝试提取首字母
            if (typeof userAnswer === 'string') {
                const match = userAnswer.match(/^[A-D]/i);
                if (match) return match[0].toUpperCase();
            }

            // 保底：原样返回
            return String(userAnswer);
        }

        // 显示评分结果
        function displayGradeResult(result) {
            const gradeContainer = document.getElementById('gradeResultContainer');

            let html = '<div class="result-card">';
            html += '<h3 style="margin-bottom: 20px; color: #667eea;">📊 评分结果</h3>';

            // 总分摘要
            if (result.score !== undefined && result.total !== undefined) {
                const percentage = Math.round((result.score / result.total) * 100);
                html += `
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div style="font-size: 48px; font-weight: bold; color: #667eea;">${result.score}/${result.total}</div>
                        <div style="font-size: 24px; color: #666;">${percentage}%</div>
                    </div>
                `;
            }

            // 整体反馈
            if (result.feedback) {
                html += `<p style="background: #e3f2fd; padding: 10px; border-radius: 5px; margin-bottom: 20px;">${result.feedback}</p>`;
            }

            // 详细题目列表
            if (result.details && Array.isArray(result.details) && result.details.length > 0) {
                html += '<h4 style="margin-bottom: 15px;">📝 题目详情</h4>';

                result.details.forEach((item, idx) => {
                    console.log(`题目 ${idx + 1} 原始数据:`, item);
                    const isCorrect = item.correct === true;
                    const borderColor = isCorrect ? '#4caf50' : (item.correct === false ? '#f44336' : '#ff9800');
                    const statusIcon = isCorrect ? '✅' : (item.correct === false ? '❌' : '⚠️');

                    // 难度和题型标签
                    const difficulty = item.difficulty || '';
                    const diffColors = { '简单': '#4caf50', '中': '#ff9800', '难': '#f44336' };
                    const diffColor = diffColors[difficulty] || '#999';
                    const typeLabels = { 'mcq': '选择题', 'fill_blank': '填空题', 'short': '简答题' };
                    const typeLabel = typeLabels[item.type] || item.type || '';

                    html += `
                        <div style="border-left: 5px solid ${borderColor}; padding: 15px; margin-bottom: 15px; background: #f9f9f9; border-radius: 0 8px 8px 0;">
                            <p><strong>${statusIcon} 问题 ${idx + 1}:</strong> ${item.question || '未知问题'}</p>
                    `;

                    // 难度和题型标签
                    if (difficulty || typeLabel) {
                        html += '<div style="display: flex; gap: 8px; margin: 8px 0;">';
                        if (difficulty) html += `<span style="background: ${diffColor}; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8em;">${difficulty}</span>`;
                        if (typeLabel) html += `<span style="background: #667eea; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8em;">${typeLabel}</span>`;
                        html += '</div>';
                    }

                    // 显示选项（如果是选择题）
                    if (item.type === 'mcq' && item.options && Array.isArray(item.options) && item.options.length > 0) {
                        html += '<div style="margin: 8px 0 8px 15px;">';
                        item.options.forEach(opt => {
                            html += `<div style="margin: 3px 0; color: #555;">${opt}</div>`;
                        });
                        html += '</div>';
                    }

                    // 用户答案
                    let userAnswerDisplay = (item.type === 'mcq') ? safeMapUserAnswer(item.user_answer) : (item.user_answer || '(未回答)');
                    html += `<p><strong>你的答案:</strong> ${userAnswerDisplay}</p>`;

                    // 正确答案
                    if (item.correct_answer !== undefined) {
                        html += `<p><strong>正确答案:</strong> ${item.correct_answer}</p>`;
                    } else if (item.expected) {
                        html += `<p><strong>正确答案:</strong> ${item.expected}</p>`;
                    }

                    html += '</div>';
                });
            } else {
                html += '<p>无详细题目信息</p>';
            }

            html += '</div>';
            gradeContainer.innerHTML = html;
        }

        // 导航按钮
        backToStep2Btn.addEventListener('click', () => showStep(2));
        gotoStep4Btn.addEventListener('click', () => showStep(4));
        backToStep3Btn = document.getElementById('backToStep3Btn');
        backToStep3Btn.addEventListener('click', () => showStep(3));
        restartBtn = document.getElementById('restartBtn');
        restartBtn.addEventListener('click', function () {
            // 重置所有状态
            appState = {
                docId: null,
                selectedMode: null,
                query: '',
                currentQuizData: null,
                currentQuizId: null,
                userAnswers: {},
                generateResult: null
            };

            // 重置UI
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            uploadArea.style.display = 'block';
            uploadResult.classList.add('hidden');
            uploadProgress.classList.add('hidden');
            modeCards.forEach(c => c.classList.remove('selected'));
            querySection.classList.add('hidden');
            queryInput.value = '';
            generateBtn.disabled = true;
            resultContainer.innerHTML = '';
            quizSubmitSection.classList.add('hidden');

            showStep(1);
        });

        // ---------- 辅助：测试后端连接 ----------
        // 页面加载时自动测试连接
        (async function testConnection() {
            try {
                const response = await fetch(`${API_BASE}/test`);
                const data = await response.json();
                console.log('后端连接成功:', data);
            } catch (error) {
                console.error('后端连接失败，请确保服务器已启动:', error);
                alert('⚠️ 无法连接到后端服务器！\n请确认 http://localhost:5000 是否已启动。');
            }
        })();
    </script>
</body>

</html>
