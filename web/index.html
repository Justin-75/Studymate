<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate · AI 学习伴侣</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#f9fafc; --ink:#1b2130; --muted:#667085; --faint:#98a2b3;
  --line:#e5e8ef; --accent:#4f46e5; --accent-ink:#ffffff; --accent-weak:#eef0ff; --ok:#12a150; --ok-weak:#e7f7ee;
  --bad:#e5484d; --bad-weak:#fdecec; --warn:#d97706; --warn-weak:#fff4e0; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --radius:14px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1117; --panel:#161a22; --panel-2:#1b2029; --ink:#e7eaf0; --muted:#9aa4b2; --faint:#6b7585; --line:#262c37;
    --accent:#8b8cf8; --accent-ink:#0e1117; --accent-weak:#232650; --ok:#3ecf8e; --ok-weak:#12301f; --bad:#ff6b6f; --bad-weak:#3a1618;
    --warn:#f5a524; --warn-weak:#3a2a0c; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:18px;height:18px;flex:none}

.app{display:grid;grid-template-columns:288px 1fr;height:100vh}

/* ---------- sidebar ---------- */
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:16px}
.brand span{font-size:12px;color:var(--muted)}
.upload-btn{margin:4px 14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);font-weight:600}
.upload-btn:hover{filter:brightness(1.07)}
.side-label{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:12px 18px 6px}
.doc-list{list-style:none;overflow-y:auto;padding:0 8px;flex:1;min-height:80px}
.doc{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.doc:hover{background:var(--panel-2)}
.doc.active{background:var(--accent-weak)}
.doc-icon{margin-top:2px;color:var(--muted)}
.doc.active .doc-icon{color:var(--accent)}
.doc-name{font-size:14px;font-weight:600;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.mastery{border-top:1px solid var(--line);padding:10px 18px 12px;max-height:34vh;overflow-y:auto}
.mastery h4{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:600}
.m-row{margin-bottom:8px}
.m-top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.m-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-bar{height:6px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.m-bar i{display:block;height:100%;border-radius:99px}
.m-empty{font-size:13px;color:var(--muted)}
.side-foot{border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.llm{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok)}
.lang{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.menu-btn{display:none;padding:6px;border-radius:8px}
.title{flex:1;min-width:0}
.title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

.chat{flex:1;overflow-y:auto;padding:24px 22px 12px}
.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:flex-start}
.row.user{justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:9px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.bubble{background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:75%;white-space:pre-wrap;word-break:break-word}
.bubble .pill{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;margin-right:6px;border-radius:99px;background:rgba(255,255,255,.22);vertical-align:1px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;flex:1;min-width:0}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kicker{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.md p{margin:0 0 8px}.md p:last-child{margin:0}
.md ul{margin:4px 0 8px 18px}
.md code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:13px}
.points{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.points li{display:flex;gap:8px;align-items:baseline}
.points li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
.pg{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:99px;background:var(--accent-weak);color:var(--accent);white-space:nowrap;line-height:20px;vertical-align:middle}
a.pg{text-decoration:none}a.pg:hover{filter:brightness(.95)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:13.5px;color:var(--muted);background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.error{color:var(--bad);background:var(--bad-weak);border-color:transparent}

/* summary sections */
details.sec{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--panel-2)}
details.sec summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .chev{transition:transform .15s;color:var(--muted)}
details.sec[open] summary .chev{transform:rotate(90deg)}
.sec-title{flex:1;font-weight:600;font-size:14px}
.sec-body{padding:0 12px 12px 34px;font-size:14px}
.sec-main{color:var(--muted);margin-bottom:4px}

/* flashcards */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:8px}
.fc{perspective:900px;height:150px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;overflow:auto}
.fc-front{background:var(--panel-2);justify-content:center;align-items:center;text-align:center;font-weight:700}
.fc-back{background:var(--accent-weak);transform:rotateY(180deg);font-size:13.5px;gap:6px}
.fc-n{position:absolute;top:8px;left:10px;font-size:11px;color:var(--faint);font-weight:600}
.fc-hint{font-size:12px;color:var(--muted);margin-top:6px}

/* quiz */
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q-head{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.q-num{font-weight:700;color:var(--accent);flex:none}
.q-type{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px;flex:none}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.opt:hover{background:var(--panel-2)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.q input[type=text],.q textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.q textarea{min-height:64px;resize:vertical}
.quiz.locked .opt,.quiz.locked input,.quiz.locked textarea{cursor:default;opacity:.75}
.quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.quiz-foot span{font-size:13px;color:var(--muted)}

/* grade */
.score{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.score-num{font-size:30px;font-weight:800;line-height:1}
.score-bar{flex:1;height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.score-bar i{display:block;height:100%}
.res{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.mark.ok{background:var(--ok-weak);color:var(--ok)}.mark.bad{background:var(--bad-weak);color:var(--bad)}
.res-q{font-weight:600;font-size:14px}
.res-line{font-size:13.5px;color:var(--muted)}
.res-line b{color:var(--ink);font-weight:600}
.next{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.next.review{background:var(--warn-weak);color:var(--warn)}
.next.done{background:var(--ok-weak);color:var(--ok)}

/* progress */
.steps{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.steps li{display:flex;gap:8px;align-items:center}
.steps li.done::before{content:"✓";color:var(--ok);font-weight:800;width:14px}
.steps li.now::before{content:"";width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* StudyMate is talking: bouncing dots + a pulsing avatar */
.typing{display:inline-flex;gap:4px;align-items:center;height:18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:talk 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes talk{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.avatar.talking{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-weak)}50%{box-shadow:0 0 0 6px transparent}}
.talk-head{display:flex;align-items:center;gap:10px;font-size:14px}
.talk-head b{flex:1;min-width:0}
.working .bar{height:6px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.working .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.working .bar.indet i{width:35%;animation:indet 1.4s infinite ease-in-out}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion: reduce){.typing i,.avatar.talking,.working .bar.indet i,.steps li.now::before{animation:none}}
/* while StudyMate is replying or summarizing, nothing else can be sent */
.thread.locked [data-send],.thread.locked [data-quick],.thread.locked form.quiz button[type=submit],.chips.locked .chip{opacity:.45;pointer-events:none}

/* guide (shown when a document is opened) */
details.guide>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:15px}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary .chev{transition:transform .15s;color:var(--muted)}
details.guide[open]>summary .chev{transform:rotate(90deg)}
details.guide>summary b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guide-body{margin-top:10px}
.lead{color:var(--muted);font-size:14px;margin-top:8px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.feat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.feat-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.num{width:20px;height:20px;border-radius:6px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.feat p{font-size:13px;color:var(--muted);flex:1}
.feat .btn{align-self:flex-start}
.how{font-size:13px;color:var(--muted);margin-top:14px;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.how b{color:var(--ink);font-size:13px}

/* welcome / empty */
.hero{text-align:center;padding:48px 20px}
.hero h2{font-size:22px;margin-bottom:6px}
.hero p{color:var(--muted);margin-bottom:18px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:40px 20px;background:var(--panel);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.sugg button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:14px}
.sugg button:hover{border-color:var(--accent);background:var(--accent-weak)}
.sugg small{display:block;color:var(--muted);font-size:12px}

/* composer */
.composer{padding:10px 22px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer-inner{max-width:820px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:13px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:600}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.inputbox{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.inputbox:focus-within{border-color:var(--accent)}
.inputbox textarea{flex:1;border:0;outline:0;resize:none;background:transparent;max-height:160px;min-height:24px;padding:4px 0}
.send{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}

.overlay{position:fixed;inset:0;background:rgba(79,70,229,.12);border:3px dashed var(--accent);display:none;place-items:center;font-size:20px;font-weight:700;color:var(--accent);z-index:50}
.overlay.on{display:grid}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
.scrim{display:none}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:288px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .menu-btn{display:inline-flex}
  .chat{padding:16px 12px 8px}.composer{padding:8px 12px 12px}.topbar{padding:10px 12px}
  .top-actions .btn span{display:none}
  .bubble{max-width:88%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div><b>StudyMate</b><span data-i18n="tagline"></span></div>
    </div>
    <button class="upload-btn" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
      <span data-i18n="upload"></span>
    </button>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
    <div class="side-label" data-i18n="myDocs"></div>
    <ul class="doc-list" id="docList"></ul>
    <div class="mastery" id="mastery"></div>
    <div class="side-foot">
      <div class="llm" id="llm"><i class="dot"></i><span>…</span></div>
      <button class="lang" id="langBtn">EN</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="title"><b id="docTitle">StudyMate</b><span id="docSub"></span></div>
      <div class="top-actions">
        <button class="btn" id="summaryBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
          <span data-i18n="docSummary"></span>
        </button>
        <button class="btn" id="newChatBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="newChat"></span>
        </button>
      </div>
    </header>

    <div class="chat" id="chat"><div class="thread" id="thread"></div></div>

    <div class="composer">
      <div class="composer-inner">
        <div class="chips" id="chips"></div>
        <form class="inputbox" id="form">
          <textarea id="input" rows="1"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <div class="hint" data-i18n="hint"></div>
      </div>
    </div>
  </main>
</div>
<div class="overlay" id="overlay" data-i18n="dropHere"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

// This page is served by the StudyMate server (python server/http_server.py -> http://localhost:5000).
// Double-clicked as a file it cannot reach the API, so load it from the server instead. Served by some
// other local dev server (an editor's live preview), connect() points the API calls at the server.
const SERVER = "http://localhost:5000";
if (location.protocol === "file:") { location.replace(SERVER + "/"); return; }
let API = "";   // "" = same origin; set by connect()

// ---------------------------------------------------------------------------
// Text (中文 / English)
// ---------------------------------------------------------------------------
const T = {

let lang = load("sm.lang", "zh");
const t = (k, ...a) => { const v = T[lang][k] ?? T.zh[k] ?? k; return typeof v === "function" ? v(...a) : v; };

// ---------------------------------------------------------------------------
// State + small helpers
// ---------------------------------------------------------------------------
const S = { docs: [], doc: null, threadId: null, messages: [], awaiting: false, mastery: {}, busy: false,
            summaryCache: {}, guideOpen: null };   // guideOpen: null = open only while the chat is empty
const $ = id => document.getElementById(id);
const thread = $("thread"), input = $("input");

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : "t" + Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function toast(msg, ms = 2600) { const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), ms); }
function md(text) {
  const lines = esc(text).split("\n"); let html = "", list = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    if (/^\s*[-•]\s+/.test(line)) { if (!list) { html += "<ul>"; list = true; } html += `<li>${line.replace(/^\s*[-•]\s+/, "")}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (line.trim()) html += `<p>${line}</p>`;
  }
  return (list ? html + "</ul>" : html);
}
function pageChip(p) {
  if (!p) return "";
  const label = `p.${p}`;
  return S.doc?.has_pdf ? `<a class="pg" href="${API}/api/documents/${encodeURIComponent(S.doc.doc_id)}/pdf#page=${p}" target="_blank" rel="noopener">${label}</a>` : `<span class="pg">${label}</span>`;
}
const pr = (a, b) => a === b ? `p.${a}` : `p.${a}-${b}`;
function scoreColor(v) { return v >= .8 ? "var(--ok)" : v >= .6 ? "var(--warn)" : "var(--bad)"; }
async function api(url, opts = {}) {
  const res = await fetch(API + url, opts);
  let body = {}; try { body = await res.json(); } catch { /* not json */ }
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("langBtn").textContent = lang === "zh" ? "EN" : "中文";
  renderChips(); renderDocs(); renderHeader(); renderMastery(); renderThread();
}

// ---------------------------------------------------------------------------
// Sidebar: documents + mastery
// ---------------------------------------------------------------------------
function statusBadges(d) {
  if (d.uploading) return `<span class="badge warn">${t("uploading")}</span>`;
  if (d.index === "building") return `<span class="badge warn">${t("st_indexing")}</span>`;
  if (d.index === "error") return `<span class="badge bad">${t("st_indexError")}</span>`;
  const m = { ready: ["ok", "st_sumReady"], building: ["warn", "st_sumBuilding"], none: ["", "st_sumNone"], error: ["bad", "st_sumError"] }[d.summary] || ["", "st_sumNone"];
  const p = d.summary === "building" && d.summary_progress?.total ? ` ${d.summary_progress.done}/${d.summary_progress.total}` : "";
  return `<span class="badge ${m[0]}">${t(m[1])}${p}</span>`;
}
function renderDocs() {
  const list = $("docList");
  list.innerHTML = S.docs.map(d => `
    <li class="doc ${S.doc && d.doc_id === S.doc.doc_id ? "active" : ""}" data-id="${esc(d.doc_id)}">
      <svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      <div style="min-width:0">
        <div class="doc-name">${esc(d.filename)}</div>
        <div class="doc-meta">${d.pages ? `${d.pages} ${t("pages")}` : ""} ${statusBadges(d)}</div>
      </div>
    </li>`).join("");
}
function renderMastery() {
  const el = $("mastery"), entries = Object.entries(S.mastery || {}).sort((a, b) => a[1] - b[1]);
  el.innerHTML = `<h4>${t("mastery")}</h4>` + (entries.length ? entries.map(([c, v]) => `
    <div class="m-row"><div class="m-top"><span title="${esc(c)}">${esc(c)}</span><span>${Math.round(v * 100)}%</span></div>
    <div class="m-bar"><i style="width:${Math.max(4, v * 100)}%;background:${scoreColor(v)}"></i></div></div>`).join("")
    : `<div class="m-empty">${t("masteryEmpty")}</div>`);
}
// Why nothing can be sent right now ("" = it can): no document, still indexing, the document
// summary is being built, or StudyMate is in the middle of a reply.
function chatLock() {
  const d = S.doc;
  if (!d) return "nodoc";
  if (d.index !== "ready") return "index";
  if (d.summary === "building") return "summary";
  return S.busy ? "busy" : "";
}
function renderHeader() {
  const d = S.doc, lock = chatLock();
  $("docTitle").textContent = d ? d.filename : "StudyMate";
  $("docSub").innerHTML = d ? `${d.pages ? d.pages + " " + t("pages") + " · " : ""}${statusBadges(d)}` : "";
  $("summaryBtn").disabled = !!lock;
  $("newChatBtn").disabled = !d || S.busy;
  input.disabled = !!lock;
  $("sendBtn").disabled = !!lock;
  input.placeholder = { nodoc: t("placeholderNoDoc"), index: t("placeholderIndexing"), summary: t("placeholderSummarizing") }[lock] || t("placeholder");
  thread.classList.toggle("locked", !!lock);
  $("chips").classList.toggle("locked", !!lock);
  renderWorking();
}
// The "StudyMate is working" row at the end of the chat while the document is indexed or summarized.
// Updated in place on every poll, so the rest of the chat (e.g. typed quiz answers) is left alone.
function renderWorking() {
  const d = S.doc, kind = !d ? "" : d.index === "building" ? "index" : d.summary === "building" ? "summary" : "";
  let row = $("working");
  if (!kind) { row?.remove(); return; }
  if (!row || row.dataset.kind !== kind) {
    row?.remove();
    row = document.createElement("div"); row.className = "row"; row.id = "working"; row.dataset.kind = kind;
    row.innerHTML = `<div class="avatar talking">S</div><div class="card working">
      <div class="talk-head"><b class="w-title"></b><span class="typing"><i></i><i></i><i></i></span></div>
      <div class="res-line w-line"></div><div class="bar"><i></i></div></div>`;
    thread.appendChild(row);
    if (S.messages.length) scrollDown();
  }
  const p = d.summary_progress || {}, pct = kind === "summary" && p.total ? Math.round(100 * p.done / p.total) : null;
  const stage = { cards: t("w_cards", p.done, p.total), planning: t("w_planning"), summarizing: t("w_summarizing", p.done, p.total), revising: t("w_revising", p.done, p.total),
                  checking: t("w_checking"), overview: t("w_overview") }[p.stage] || t("w_start");
  row.querySelector(".w-title").textContent = t(kind === "index" ? "w_index" : "w_title");
  row.querySelector(".w-line").textContent = kind === "index" ? t("w_indexLocked") : `${stage} · ${t("w_locked")}`;
  const bar = row.querySelector(".bar");
  bar.classList.toggle("indet", pct === null);
  bar.firstElementChild.style.width = pct === null ? "" : `${Math.max(3, pct)}%`;
}
function renderChips() {
  // one click = that kind of answer right away; whatever is typed in the box becomes its topic
  const chips = [["c_summary", "summary"], ["c_cards", "flashcard"], ["c_quiz", "quiz"]];
  const el = $("chips"); el.innerHTML = "";
  for (const [k, intent] of chips) { const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = t(k); b.onclick = () => { if (!input.disabled) quick(intent); }; el.appendChild(b); }
}
function quick(intent) { send(input.value.trim() || t("q_" + intent), intent); }

async function refreshDocs() {
  try {
    const { documents } = await api("/api/documents");
    const uploading = S.docs.filter(d => d.uploading);
    S.docs = [...uploading, ...documents];
    const fresh = S.doc && S.docs.find(d => d.doc_id === S.doc.doc_id);
    if (fresh) {
      const changed = fresh.index !== S.doc.index || fresh.summary !== S.doc.summary;
      S.doc = fresh;
      if (changed) refreshGuide();          // its notes and buttons follow the document's status
    }
    renderDocs(); renderHeader();
  } catch (e) { console.warn(e); }
  const pending = S.docs.some(d => d.index === "building" || d.summary === "building");
  clearTimeout(refreshDocs._t); refreshDocs._t = setTimeout(refreshDocs, pending ? 3000 : 15000);
}

async function selectDoc(docId) {
  const d = S.docs.find(x => x.doc_id === docId); if (!d || d.uploading) return;
  S.doc = d; save("sm.doc", docId);
  const threads = load("sm.threads", {});
  S.threadId = threads[docId] || uuid(); threads[docId] = S.threadId; save("sm.threads", threads);
  closeSidebar(); await loadThread();
}
async function loadThread() {
  S.messages = []; S.awaiting = false; S.mastery = {}; S.guideOpen = null;
  try {
    const p = await api(`/api/threads/${encodeURIComponent(S.threadId)}`);
    S.messages = p.messages || []; S.awaiting = p.awaiting_answers; S.mastery = p.mastery || {};
  } catch (e) { console.warn(e); }
  renderDocs(); renderHeader(); renderMastery(); renderThread(true);
}
function newChat() {
  if (!S.doc) return;
  const threads = load("sm.threads", {}); S.threadId = uuid(); threads[S.doc.doc_id] = S.threadId; save("sm.threads", threads);
  S.messages = []; S.awaiting = false; S.mastery = {}; S.guideOpen = null; renderMastery(); renderThread();
}
async function buildSummary(btn) {
  btn.disabled = true;
  try {
    await api(`/api/documents/${encodeURIComponent(S.doc.doc_id)}/summarize`, { method: "POST" });
    S.doc.summary = "building"; renderHeader(); renderThread(false); refreshDocs();
  } catch (e) { toast(e.message); btn.disabled = false; }
}

// ---------------------------------------------------------------------------
// Upload
// ---------------------------------------------------------------------------
async function upload(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name)) { toast("PDF only"); return; }
  const tmp = { doc_id: "uploading-" + Date.now(), filename: file.name, uploading: true };
  S.docs.unshift(tmp); renderDocs();
  const fd = new FormData(); fd.append("file", file);
  try {
    const { document: doc } = await api("/api/upload", { method: "POST", body: fd });
    S.docs = S.docs.filter(d => d !== tmp && d.doc_id !== doc.doc_id); S.docs.unshift(doc);
    toast(t("uploadOk")); await selectDoc(doc.doc_id); refreshDocs();
  } catch (e) {
    S.docs = S.docs.filter(d => d !== tmp); renderDocs(); toast(`${t("uploadFail")}: ${e.message}`, 5000);
  }
}

// ---------------------------------------------------------------------------
// Chat thread rendering
// ---------------------------------------------------------------------------
function renderThread(scroll = true) {
  if (!S.doc) { thread.innerHTML = emptyState(); bindEmpty(); return; }
  const lastQuiz = S.messages.map(m => m.kind).lastIndexOf("quiz");
  thread.innerHTML = guide() + S.messages.map((m, i) => renderMessage(m, i, S.awaiting && i === lastQuiz, answersFor(i))).join("");
  bindThread();
  renderWorking();
  if (scroll && S.messages.length) scrollDown();
  loadSummary();
}
function refreshGuide() {
  // re-render only the guide, so the rest of the chat (e.g. typed quiz answers) is left alone
  const g = $("guide");
  if (g && S.doc) { g.outerHTML = guide(); bindThread(); }
  loadSummary();
}
function scrollDown() { const c = $("chat"); requestAnimationFrame(() => c.scrollTop = c.scrollHeight); }

function emptyState() {
  return `<div class="hero"><h2>${t("emptyTitle")}</h2><p>${t("emptyText")}</p>
    <div class="drop" id="dropCard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:36px;height:36px;color:var(--accent)"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
    <div style="margin-top:8px;font-weight:600">${t("emptyDrop")}</div></div></div>`;
}
function bindEmpty() { const c = $("dropCard"); if (c) c.onclick = () => $("fileInput").click(); }

// The guide: what you can do with this document and how answers are found. First card of every chat,
// open while the chat is empty and folded away (one click to reopen) once there are messages.
function guide() {
  const d = S.doc, sum = S.summaryCache[d.doc_id], ready = d.index === "ready", off = ready ? "" : "disabled";
  const open = S.guideOpen ?? !S.messages.length;
  const term = sum?.sections?.flatMap(s => s.key_terms || [])[0];
  const feat = (n, title, text, action) => `<div class="feat"><div class="feat-h"><span class="num">${n}</span>${t(title)}</div><p>${t(text)}</p>${action}</div>`;
  const feats = [
    feat(1, "f_ask", "f_askText", term ? `<button class="btn" data-send="${esc(t("g_askExample", term))}" data-intent="ask" ${off}>${t("g_try")}: ${esc(t("g_askExample", term))}</button>` : ""),
    feat(2, "f_sum", "f_sumText", `<button class="btn" data-send="${esc(t("msg_docSummary"))}" data-intent="summary" ${off}>${t("docSummary")}</button>`),
    feat(3, "f_cards", "f_cardsText", `<button class="btn" data-quick="flashcard" ${off}>${t("g_cardsBtn")}</button>`),
    feat(4, "f_quiz", "f_quizText", `<button class="btn primary" data-quick="quiz" ${off}>${t("g_quizBtn")}</button>`),
  ].join("");
  const sections = sum?.sections?.length ? `<div class="kicker" style="margin-top:14px">${t("g_sections")}</div><div class="sugg">${sum.sections.slice(0, 6).map(s =>
    `<button data-send="${esc(s.title)}" data-intent="quiz" ${off}><b>${t("s_quiz")} · ${esc(s.title)}</b><small>${pr(s.start, s.end)}</small></button>`).join("")}</div>` : "";
  let note = "";
  if (!ready) note = `<div class="note" style="margin-top:12px">${t("welcomeIndexing")}</div>`;
  else if (d.summary === "building") note = `<div class="note" style="margin-top:12px">${t("welcomeBuilding")}</div>`;
  else if (d.summary === "none" || d.summary === "error") {
    const why = d.summary === "error" && d.summary_error ? `${t("st_sumError")}: ${esc(d.summary_error)}` : t("welcomeNone");
    note = `<div class="note" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span style="min-width:0;flex:1">${why}</span><button class="btn" data-build>${t("buildSummary")}</button></div>`;
  }
  const head = sum ? `<div class="kicker">${esc(sum.subject)}</div><div class="md" style="color:var(--muted)">${md(sum.overview)}</div>` : "";
  return `<div class="row" id="guide"><div class="avatar">S</div><details class="card guide" ${open ? "open" : ""}>
    <summary><b>${t("guideTitle")} · ${esc(d.filename)}</b><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></summary>
    <div class="guide-body">${note}${head}<p class="lead">${t("guideIntro")}</p><div class="feats">${feats}</div>${sections}
      <div class="how"><b>${t("g_howTitle")}</b><span>${t("g_how1")}</span><span>${t("g_how2")}</span><span>${t("g_tip")}</span></div></div></details></div>`;
}
const summaryRequests = new Set();
async function loadSummary() {
  // the guide shows the document's subject and chapters once its summary exists
  const d = S.doc;
  if (!d || d.summary !== "ready" || S.summaryCache[d.doc_id] || summaryRequests.has(d.doc_id)) return;
  summaryRequests.add(d.doc_id);
  try {
    const r = await api(`/api/documents/${encodeURIComponent(d.doc_id)}/summary`);
    if (r.summary) {
      S.summaryCache[d.doc_id] = r.summary;
      if (S.doc?.doc_id === d.doc_id) refreshGuide();
    }
  } catch { /* the guide works without it */ } finally { summaryRequests.delete(d.doc_id); }
}

function answersFor(i) {
  // the grade card that follows quiz i holds what the student answered
  if (S.messages[i]?.kind !== "quiz") return null;
  for (let j = i + 1; j < S.messages.length; j++) {
    const m = S.messages[j];
    if (m.kind === "quiz") return null;
    if (m.kind === "grade") return Object.fromEntries((m.data?.results || []).map(r => [r.id, r]));
  }
  return null;
}
function renderMessage(m, i, activeQuiz, answered) {
  if (m.role === "user") return `<div class="row user"><div class="bubble">${m.intent ? `<span class="pill">${t("i_" + m.intent)}</span>` : ""}${esc(m.text)}</div></div>`;
  const body = ({ answer: rAnswer, doc_summary: rDocSummary, topic_summary: rTopic, review: rReview, flashcards: rCards,
                  quiz: (m, i) => rQuiz(m, i, activeQuiz, answered), grade: rGrade, info: rInfo }[m.kind] || rText)(m, i);
  return `<div class="row"><div class="avatar">S</div>${body}</div>`;
}
const points = kps => `<ul class="points">${(kps || []).map(k => `<li><span>${esc(k.text)} ${pageChip(k.page)}</span></li>`).join("")}</ul>`;

function rText(m) { return `<div class="card md">${md(m.text)}</div>`; }
function rInfo(m) {
  const code = m.data?.code;
  const key = { no_context: "notFound", summary_missing: "i_summaryMissing", summary_building: "i_summaryBuilding",
                no_quiz: "i_noQuiz", no_flashcards: "i_noCards" }[code];
  const build = code === "summary_missing" && S.doc && !["ready", "building"].includes(S.doc.summary)
    ? `<div class="card-actions"><button class="btn" data-build>${t("buildSummary")}</button></div>` : "";
  return `<div class="card"><div class="note">${esc(key ? t(key) : m.text)}</div>${build}</div>`;
}
function rAnswer(m) {
  const d = m.data || {}, pages = (d.pages || []).filter(Boolean);
  return `<div class="card"><div class="md">${md(d.answer ?? m.text)}</div>
    ${d.found !== false && pages.length ? `<div class="tags"><span class="res-line">${t("sources")}:</span> ${[...new Set(pages)].sort((a, b) => a - b).map(pageChip).join(" ")}</div>` : ""}</div>`;
}
function rDocSummary(m) {
  const d = m.data || {};
  const secs = (d.sections || []).map((s, j) => `
    <details class="sec" ${j === 0 ? "open" : ""}><summary>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      <span class="sec-title">${esc(s.title)}</span><span class="pg">${pr(s.start, s.end)}</span></summary>
      <div class="sec-body"><div class="sec-main">${esc(s.main_idea)}</div>${points(s.key_points)}
        ${(s.key_terms || []).length ? `<div class="tags">${s.key_terms.map(k => `<span class="tag">${esc(k)}</span>`).join("")}</div>` : ""}
        <div class="card-actions"><button class="btn" data-send="${esc(s.title)}" data-intent="quiz">${t("quizThis")}</button>
        <button class="btn" data-send="${esc(s.title)}" data-intent="flashcard">${t("cardsThis")}</button></div></div></details>`).join("");
  return `<div class="card"><div class="kicker">${t("k_docSummary")}</div><h3>${esc(d.subject)}</h3><div class="md">${md(d.overview || "")}</div>${secs}</div>`;
}
function rTopic(m) {
  const d = m.data || {};
  return `<div class="card"><div class="kicker">${t("k_topic")}${d.topic ? " · " + esc(d.topic) : ""}</div><div class="md"><p><b>${esc(d.main_idea)}</b></p></div>${points(d.key_points)}
    ${d.topic ? `<div class="card-actions"><button class="btn" data-send="${esc(d.topic)}" data-intent="quiz">${t("s_quiz")}</button><button class="btn" data-send="${esc(d.topic)}" data-intent="flashcard">${t("s_cards")}</button></div>` : ""}</div>`;
}
function rReview(m) {
  const d = m.data || {};
  return `<div class="card"><div class="kicker">${t("k_review")}</div><h3>${(d.concepts || []).map(c => `<span class="tag">${esc(c)}</span>`).join(" ")}</h3>
    <div class="md"><p>${esc(d.main_idea)}</p></div>${points(d.key_points)}</div>`;
}
function rCards(m) {
  const d = m.data || {};
  const cards = (d.cards || []).map((c, j) => `
    <div class="fc" tabindex="0"><div class="fc-inner">
      <div class="fc-face fc-front"><span class="fc-n">${j + 1}/${d.cards.length}</span>${esc(c.front)}</div>
      <div class="fc-face fc-back"><div>${esc(c.back)}</div><div>${pageChip(c.page)}</div></div>
    </div></div>`).join("");
  return `<div class="card"><div class="kicker">${t("k_cards")}${d.topic ? " · " + esc(d.topic) : ""}</div><div class="fc-grid">${cards}</div>
    <div class="fc-hint">${t("flipHint")}</div>
    ${d.topic ? `<div class="card-actions"><button class="btn primary" data-send="${esc(d.topic)}" data-intent="quiz">${t("quizFromCards")}</button></div>` : ""}</div>`;
}
function rQuiz(m, i, active, answered) {
  const d = m.data || {}, lock = !active, given = id => (answered && answered[id] ? answered[id].your_answer || "" : "");
  const typeLabel = { mcq: t("mcq"), fill_blank: t("fill"), short: t("short") };
  const qs = (d.questions || []).map((q, j) => {
    let field = "";
    if (q.type === "mcq") field = `<div class="opts">${(q.options || []).map(o => {
        const letter = o.trim().charAt(0).toUpperCase();
        const chosen = given(q.id).trim().charAt(0).toUpperCase() === letter;
        return `<label class="opt"><input type="radio" name="m${i}-${esc(q.id)}" value="${esc(letter)}" ${chosen ? "checked" : ""} ${lock ? "disabled" : ""}><span>${esc(o)}</span></label>`; }).join("")}</div>`;
    else if (q.type === "fill_blank") field = `<input type="text" name="m${i}-${esc(q.id)}" value="${esc(given(q.id))}" ${lock ? "disabled" : ""}>`;
    else field = `<textarea name="m${i}-${esc(q.id)}" ${lock ? "disabled" : ""}>${esc(given(q.id))}</textarea>`;
    return `<div class="q" data-qid="${esc(q.id)}" data-type="${esc(q.type)}"><div class="q-head"><span class="q-num">${j + 1}.</span><span style="flex:1">${esc(q.question)}</span><span class="q-type">${typeLabel[q.type] || q.type}</span></div>${field}</div>`;
  }).join("");
  const focus = (d.focus || []).length ? `<span class="res-line">${t("focus")}:</span> ${d.focus.map(c => `<span class="tag">${esc(c)}</span>`).join(" ")}` : "";
  return `<form class="card quiz ${lock ? "locked" : ""}" data-quiz="${i}"><div class="kicker">${t("k_quiz")} · ${t("round", d.round || 1)}</div>
    <h3>${esc(d.topic || "")} ${focus}</h3>${qs}
    <div class="quiz-foot"><span>${lock ? t("submitted") : t("answerHint")}</span>${lock ? "" : `<button class="btn primary" type="submit">${t("submit")}</button>`}</div></form>`;
}
function rGrade(m) {
  const d = m.data || {}, ratio = d.total ? d.score / d.total : 0;
  const rows = (d.results || []).map(r => `
    <div class="res"><span class="mark ${r.correct ? "ok" : "bad"}">${r.correct ? "✓" : "✗"}</span><div style="min-width:0;flex:1">
      <div class="res-q">${esc(r.question)} <span class="tag">${esc(r.concept)}</span></div>
      <div class="res-line">${t("yourAnswer")}: <b>${r.your_answer ? esc(r.your_answer) : t("noAnswer")}</b></div>
      ${r.correct ? "" : `<div class="res-line">${t("correctAnswer")}: <b>${esc(r.correct_answer)}</b> ${pageChip(r.page)}</div>`}
      ${r.feedback ? `<div class="res-line">${esc(r.feedback)}</div>` : ""}</div></div>`).join("");
  let next;
  if (d.will_review) next = `<div class="next review">${t("nextReview", (d.weak || []).join("、"))}</div>`;
  else if ((d.weak || []).length) next = `<div class="next review">${t("maxRounds", d.weak.join("、"))}</div>`;
  else next = `<div class="next done">${t("allGood")}</div>`;
  return `<div class="card"><div class="kicker">${t("k_grade")} · ${t("round", d.round || 1)}</div>
    <div class="score"><span class="score-num">${d.score}/${d.total}</span><div class="score-bar"><i style="width:${ratio * 100}%;background:${scoreColor(ratio)}"></i></div></div>${rows}${next}</div>`;
}

function bindThread() {
  thread.querySelectorAll("[data-send]").forEach(b => b.onclick = () => send(b.dataset.send, b.dataset.intent || null));
  thread.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => quick(b.dataset.quick));
  thread.querySelectorAll("[data-build]").forEach(b => b.onclick = () => buildSummary(b));
  const g = thread.querySelector("details.guide");
  if (g) g.ontoggle = () => { S.guideOpen = g.open; };
  thread.querySelectorAll(".fc").forEach(c => { c.onclick = () => c.classList.toggle("flip"); c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); c.classList.toggle("flip"); } }; });
  thread.querySelectorAll("form.quiz:not(.locked)").forEach(f => f.onsubmit = e => { e.preventDefault(); submitQuiz(f); });
}

// ---------------------------------------------------------------------------
// Sending + streaming
// ---------------------------------------------------------------------------
function progressCard() {
  // StudyMate "talking" while it writes the reply: bouncing dots, plus each step as it finishes
  const row = document.createElement("div"); row.className = "row"; row.id = "progress";
  row.innerHTML = `<div class="avatar talking">S</div><div class="card"><div class="talk-head"><span class="typing"><i></i><i></i><i></i></span>
    <span class="res-line">${t("thinking")}</span></div><ul class="steps" style="margin-top:6px"></ul></div>`;
  thread.appendChild(row); scrollDown();
  const ul = row.querySelector(".steps");
  return {
    step(node) { if (node === "collect_answers") return; const li = document.createElement("li"); li.className = "done"; li.textContent = t("step")[node] || node; ul.appendChild(li); scrollDown(); },
    remove() { row.remove(); },
  };
}
async function stream(url, body) {   // -> true if the run finished
  setBusy(true);
  const prog = progressCard();
  try {
    const res = await fetch(API + url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { let msg = res.statusText; try { msg = (await res.json()).error || msg; } catch {} throw new Error(msg); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", done = null;
    for (;;) {
      const { value, done: end } = await reader.read(); if (end) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, k); buf = buf.slice(k + 2);
        let ev = "message", data = "";
        for (const l of raw.split("\n")) { if (l.startsWith("event:")) ev = l.slice(6).trim(); else if (l.startsWith("data:")) data += l.slice(5).trim(); }
        const payload = data ? JSON.parse(data) : {};
        if (ev === "step") prog.step(payload.node);
        else if (ev === "done") done = payload;
        else if (ev === "error") throw new Error(payload.message);
      }
    }
    prog.remove();
    if (!done) throw new Error("connection closed");
    S.messages.push(...done.messages.filter(m => m.role === "assistant"));
    S.awaiting = done.awaiting_answers; S.mastery = done.mastery || S.mastery;
    renderMastery(); renderThread();
    return true;
  } catch (e) {
    prog.remove();
    S.messages.push({ role: "assistant", kind: "info", text: t("errorPrefix") + e.message, data: {} });
    renderThread();
    return false;
  } finally { setBusy(false); refreshDocs(); }
}
function setBusy(b) { S.busy = b; renderHeader(); if (!b) input.focus(); }

// intent: set by the Quiz / Flashcards / Summary buttons; plain typed text lets the router's LLM decide
async function send(text, intent = null) {
  text = (text || "").trim();
  if (!text || chatLock()) return;
  input.value = ""; autosize();
  if (S.awaiting) S.awaiting = false;                 // a new request replaces an unanswered quiz
  S.messages.push({ role: "user", text, intent }); renderThread();
  await stream("/api/chat", { thread_id: S.threadId, doc_id: S.doc.doc_id, message: text, ...(intent ? { intent } : {}) });
}
async function submitQuiz(form) {
  if (chatLock()) return;
  const answers = {};
  form.querySelectorAll(".q").forEach(q => {
    const checked = q.querySelector("input:checked"), text = q.querySelector('input[type="text"],textarea');
    answers[q.dataset.qid] = checked ? checked.value : text ? text.value.trim() : "";
  });
  form.classList.add("locked"); form.querySelectorAll("input,textarea,button").forEach(el => el.disabled = true);
  S.awaiting = false;
  if (await stream("/api/quiz/answer", { thread_id: S.threadId, answers })) return;
  // the answers didn't go through: if the server is still waiting for them, unlock the quiz to send again
  try { S.awaiting = (await api(`/api/threads/${encodeURIComponent(S.threadId)}`)).awaiting_answers; } catch { S.awaiting = true; }
  renderThread();
}

// ---------------------------------------------------------------------------
// Composer, sidebar, drag & drop
// ---------------------------------------------------------------------------
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
$("form").onsubmit = e => { e.preventDefault(); send(input.value); };
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { upload(e.target.files[0]); e.target.value = ""; };
$("docList").onclick = e => { const li = e.target.closest(".doc"); if (li) selectDoc(li.dataset.id); };
$("summaryBtn").onclick = () => send(t("msg_docSummary"), "summary");
$("newChatBtn").onclick = newChat;
$("langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; save("sm.lang", lang); applyLang(); };
const sidebar = $("sidebar"), scrim = $("scrim");
function closeSidebar() { sidebar.classList.remove("open"); scrim.classList.remove("on"); }
$("menuBtn").onclick = () => { sidebar.classList.add("open"); scrim.classList.add("on"); };
scrim.onclick = closeSidebar;
let dragDepth = 0;
window.addEventListener("dragenter", e => { if (e.dataTransfer?.types?.includes("Files")) { dragDepth++; $("overlay").classList.add("on"); } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("overlay").classList.remove("on"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("overlay").classList.remove("on"); upload(e.dataTransfer.files[0]); });

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
async function connect() {
  // the server that served this page first, then the default address
  for (const base of ["", SERVER]) {
    try { const r = await fetch(base + "/api/health"); if (r.ok) { API = base; return await r.json(); } } catch { /* try the next one */ }
  }
  return null;
}
(async function init() {
  applyLang();
  const h = await connect();
  $("llm").innerHTML = h ? `<i class="dot on"></i><span title="${esc(h.llm.model)}">${esc(h.llm.provider)} · ${esc(h.llm.model)}</span>`
                         : `<i class="dot"></i><span>offline · python server/http_server.py</span>`;
  await refreshDocs();
  const last = load("sm.doc", null);
  if (last && S.docs.some(d => d.doc_id === last)) await selectDoc(last);
  else if (S.docs.length) await selectDoc(S.docs[0].doc_id);
  else renderThread();
})();
})();
</script>
